name: Foundation checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  application:
    name: Application
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check

  database:
    name: Database isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Start isolated local platform
        run: npm exec supabase -- start --exclude studio,imgproxy
      - name: Rebuild database from migrations and fictional seed
        run: npm run db:reset
      - run: npm run db:lint
      - run: npm run db:test
      - name: Configure isolated local credentials without printing them
        run: npm run env:local
      - name: Exercise Auth, REST, private bytes and concurrency
        run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Exercise the browser workflow
        run: npm run test:e2e
      - name: Preserve browser report and fictional-data screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
      - name: Stop local platform
        if: always()
        run: npm run db:stop
